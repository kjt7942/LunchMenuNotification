name: Daily Diet Alarm

on:
  schedule:
    # 한국 시간(KST) 오전 07:45은 UTC 기준 전날 22:45입니다.
    # 월~금 실행: 22:45 (일~목 UTC)
    - cron: '45 22 * * 0-4'
  workflow_dispatch: # 수동 실행 가능 옵션

jobs:
  send_alarm:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true' # 노드 24 강제 사용 설정 (경고 제거)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Run Alarm
        run: npx ts-node src/domain/diet/runtime/alarm.ts
        env:
          SMTP_HOST: 'smtp.gmail.com'
          SMTP_PORT: '465'
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECEIVER_EMAIL: ${{ secrets.RECEIVER_EMAIL }}
          SCHOOL_URL: 'https://school.gyo6.net/mkgms/ad/fm/foodmenu/selectFoodMenuView.do?mi=153190'
